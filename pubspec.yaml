name: flutter_application_manachyna_kusa_2_0
description: Aplicación multiservicio para la provincia de Napo, Ecuador
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.13.1
  firebase_messaging: ^15.1.3
  supabase_flutter: ^2.0.0
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.2.0
  flutter_appauth: ^12.0.2
  google_maps_flutter: ^2.5.0
  location: ^5.0.3
  path_provider: ^2.1.2
  path: ^1.9.0
  provider: ^6.1.1
  flutter_svg: ^2.2.0
  cached_network_image: ^3.3.0
  image_picker: ^1.0.4
  intl: ^0.18.1
  url_launcher: ^6.2.1
  shared_preferences: ^2.2.2
  geolocator: ^10.1.0
  permission_handler: ^12.0.0+1
  flutter_rating_bar: ^4.0.1
  cupertino_icons: ^1.0.2 
  file_picker: ^8.0.0+1  
  image: ^4.1.6
  intl_phone_field: ^3.2.0
  device_info_plus: ^12.4.0
  logging: ^1.1.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.14.3
  build_runner: ^2.15.1
  freezed: ^4.0.0-dev.3
  json_serializable: ^6.14.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/manachyna_kusa_logo_transparent.png"
  adaptive_icon_background: "#146A21"
  adaptive_icon_foreground: "assets/branding/manachyna_kusa_logo_transparent.png"

flutter:
  uses-material-design: true
  assets:
    - assets/social/
    - assets/branding/
